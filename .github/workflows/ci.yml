name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "release/**"

jobs:
  test-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release check
        run: npm run release:check
